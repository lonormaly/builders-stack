name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  affected:
    runs-on: ${{ vars.FAST_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      NX_DAEMON: "false"
      NX_MAX_CACHE_SIZE: 4GB
      NODE_OPTIONS: "--max-old-space-size=2048"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          clean: false
      - name: Clean source and keep warm dependencies
        run: |
          git reset --hard HEAD
          git clean -ffdx -e node_modules/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install build tools only when the dependency setup changed
        run: |
          fingerprint="$(bun --version; cksum bun.lock bunfig.toml)"
          if [ -f node_modules/.stack-install ] && [ "$(cat node_modules/.stack-install)" = "$fingerprint" ]; then
            echo "dependencies already match bun.lock, bunfig.toml, and Bun"
          else
            bun install --frozen-lockfile --ignore-scripts
            printf '%s\n' "$fingerprint" > node_modules/.stack-install
          fi
      - name: Find the changed range
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE"; else base="$EVENT_BEFORE"; fi
          if [ -z "${base:-}" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          echo "NX_BASE=$base" >> "$GITHUB_ENV"
          echo "NX_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Fast checks
        run: bash ops/ci/fast.sh "$NX_BASE" "$NX_HEAD"
      - name: Record affected deployables
        env:
          STACK_DEPLOYABLES_FILE: deployables.json
        run: bun ops/ci/affected-deployables.ts "$NX_BASE" "$NX_HEAD"
      - name: Save the deployment plan
        uses: actions/upload-artifact@v7
        with:
          name: deployables
          path: deployables.json
          if-no-files-found: error
          retention-days: 7
